<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#0f0f1a"/>
  <rect width="512" height="512" rx="100" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Símbolo de graduación -->
  <text x="256" y="310" font-size="240" text-anchor="middle" fill="white">🎓</text>
  <!-- Letra IA abajo -->
  <text x="256" y="440" font-size="72" text-anchor="middle" fill="white" font-family="Arial Black, sans-serif" font-weight="900" opacity="0.9">IA</text>
